<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query two</title>
    <style>
        /*GERAIS*/ 
        *{
    margin: 0;
    padding: 0;
}

html, body{
    width: 100vw;
    height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #233eff;
}

h1{
    color: white;
    text-shadow: 3px 3px 0px black;
}
        /*RETRATO*/
        @media screen and (orientation: portrait) {
            body{
                background-image: url(/EXERCICIOS/ex026/mq003/imagens/cev-portrait.jpg);
                background-repeat: no-repeat;
                background-size: cover;
                background-attachment: scroll;
}
        }
        /*PAISAGEM*/
        @media screen and (orientation: landscape){
            body{
    background-image: url(/EXERCICIOS/ex026/mq003/imagens/cev-landscape.jpg);
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: scroll;
            }
        }

    </style>
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
</body>
</html>
