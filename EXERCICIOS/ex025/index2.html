<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 2</title>
</head>
<body>
    <h1>Teste de senha</h1>
    <form action="cadastro.php" autocomplete="off" method="post">
        <p><label for="Usu">Usuario: </label>
            <input type="text" name="Usuario" id="Usu" required minlength="4" max="32" placeholder="Nome do Usuario">
        </p>
        <p>
            <label for="sen">Senha: </label>
            <input type="password" name="senha" id="sen" required minlength="8" maxlength="15" size="10" placeholder="Senha">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar preenchimento">
        </p>
    </form>
</body>
</html>
