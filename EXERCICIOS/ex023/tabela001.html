<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 600px;
            height: 400px;
            border-collapse: collapse;
        }

        table td{
            border: 1px solid black;
            padding: 8px;
            font-weight: 700;
            text-align: center;
            vertical-align: top;
        }

        .gray{
            background-color: gray;
        }

        .yellow{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
    HIERARQUIA DE TABELAS SIMPLES
    TABLE = tabela
    TABLE ROW tr = linha de tabela
    TABLE HEADER th = cabeçalho de tabela
    TABLE DATA td = dado de tabela
    -->
    <table>
        <tr class="gray"> <!--PRIMEIRA LINHA-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr> <!--SEGUNDA LINHA-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr class="gray"> <!--TERCEIRA LINHA-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr> <!--QUARTA LINHA-->
            <td>A4</td>
            <td class="yellow">B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
